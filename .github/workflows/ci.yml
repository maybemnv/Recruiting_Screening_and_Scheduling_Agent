name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ruff check apps tests
      - run: python -m pytest -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install --requirement requirements.txt
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag recruiting-api:ci .
      - run: docker run --detach --name recruiting-api --publish 8104:8104 --env APP_ENV=local-fixture recruiting-api:ci
      - name: Verify container boot
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8104/health && exit 0
            sleep 1
          done
          docker logs recruiting-api
          exit 1
      - if: always()
        run: docker rm --force recruiting-api
